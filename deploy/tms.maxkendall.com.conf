# tms.maxkendall.com — static Vite build + FastAPI on 127.0.0.1:8080
#
# Installed by deploy/remote-deploy.sh:
#   sudo cp deploy/tms.maxkendall.com.conf /etc/nginx/sites-enabled/tms.maxkendall.com

# http -> https redirect
server {
    listen 80;
    server_name tms.maxkendall.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    ssl_certificate /etc/ssl/cert-sterling.pem;
    ssl_certificate_key /etc/ssl/key-sterling.pem;
    server_name tms.maxkendall.com;

    root /opt/rent-split-site/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
