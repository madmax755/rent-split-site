# tms.maxkendall.com — TLS termination + reverse-proxy to the rent-split container
#
# The production image serves both the Vite build (PUBLIC_DIR) and /api/* on :8080.
# Host nginx keeps certificates and forwards the whole site to 127.0.0.1:8080.
#
# Installed by deploy/remote-deploy.sh:
#   sudo cp deploy/tms.maxkendall.com.conf /etc/nginx/sites-enabled/tms.maxkendall.com

# http -> https redirect
server {
    listen 80;
    server_name tms.maxkendall.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    ssl_certificate /etc/ssl/cert-sterling.pem;
    ssl_certificate_key /etc/ssl/key-sterling.pem;
    server_name tms.maxkendall.com;

    # Required: the API reads X-Forwarded-For for its login rate-limiter.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
