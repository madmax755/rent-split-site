name: deploy

# Pull the registry image onto server1 and bring it up with compose.
# Triggered after a successful build-push on main, or manually.

on:
  workflow_run:
    workflows: [build-push]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (git sha short, version tag, or latest). Empty = latest."
        required: false
        default: "latest"

concurrency:
  group: deploy-server1
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  REGISTRY: 100.81.62.22:5000
  IMAGE_NAME: rent-split
  DEPLOY_DIR: /opt/rent-split-site
  DEPLOY_USER: max-kendall
  DEPLOY_HOST_FALLBACK: 100.100.126.125

jobs:
  deploy:
    runs-on: self-hosted
    # workflow_run only proceeds when build-push succeeded; dispatch always runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # For workflow_run, check out the commit that was built.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG='${{ inputs.image_tag }}'
            if [[ -z "${TAG}" ]]; then
              TAG=latest
            fi
          else
            TAG="$(echo '${{ github.event.workflow_run.head_sha }}' | cut -c1-12)"
          fi
          IMAGE="${REGISTRY}/${IMAGE_NAME}:${TAG}"
          echo "image=${IMAGE}" >> "${GITHUB_OUTPUT}"
          echo "Deploying ${IMAGE}"

      - name: Resolve server1
        id: host
        shell: bash
        run: |
          set -euo pipefail
          chmod +x deploy/resolve-tailscale-host.sh
          HOST="$(./deploy/resolve-tailscale-host.sh server1 "${DEPLOY_HOST_FALLBACK}")"
          echo "host=${HOST}" >> "${GITHUB_OUTPUT}"
          echo "user=${DEPLOY_USER}" >> "${GITHUB_OUTPUT}"
          echo "Resolved server1 -> ${DEPLOY_USER}@${HOST}"

      - name: Add SSH host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H '${{ steps.host.outputs.host }}' >> ~/.ssh/known_hosts

      - name: Sync compose + nginx to server1
        shell: bash
        run: |
          set -euo pipefail
          TARGET='${{ steps.host.outputs.user }}@${{ steps.host.outputs.host }}'
          ssh "${TARGET}" "sudo mkdir -p '${DEPLOY_DIR}' && sudo chgrp rent-split '${DEPLOY_DIR}' && sudo chmod 2771 '${DEPLOY_DIR}'"
          scp docker-compose.prod.yml "${TARGET}:/tmp/rent-split-compose.yml"
          scp deploy/tms.maxkendall.com.conf "${TARGET}:/tmp/rent-split-nginx.conf"
          scp deploy/remote-deploy.sh "${TARGET}:/tmp/rent-split-remote-deploy.sh"
          ssh "${TARGET}" "sudo cp /tmp/rent-split-compose.yml '${DEPLOY_DIR}/docker-compose.prod.yml' && chmod +x /tmp/rent-split-remote-deploy.sh"

      - name: Deploy over SSH
        shell: bash
        run: |
          set -euo pipefail
          TARGET='${{ steps.host.outputs.user }}@${{ steps.host.outputs.host }}'
          ssh "${TARGET}" \
            "IMAGE='${{ steps.image.outputs.image }}' DEPLOY_DIR='${DEPLOY_DIR}' bash /tmp/rent-split-remote-deploy.sh"
