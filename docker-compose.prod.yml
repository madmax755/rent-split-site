# Production compose example (one household per stack).
#
# Expects:
#   - Image already in your registry (see .github/workflows/build-push.yml)
#   - Env file e.g. /etc/rent-split.env (SITE_TITLE, optional leftovers)
#   - Empty or existing SQLite tree bind-mounted (preserved across deploys)
#
# For a second household: copy this file, change container_name, host port,
# env_file, and the data volume path — see README "Second household".
#
# Usage:
#   export IMAGE=registry.example/rent-split:<tag>
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d

services:
  rent-split:
    image: ${IMAGE:-100.81.62.22:5000/rent-split:latest}
    container_name: rent-split
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - /etc/rent-split.env
    environment:
      # Compose wins over env_file so container paths stay correct even if the
      # host env still has a host-side DATA_DIR path.
      PORT: "8080"
      DATA_DIR: /data
      PUBLIC_DIR: /app/public
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - /opt/rent-split-site/data:/data
    # Match the image USER (uid 1000). If host data/ is owned by another uid,
    # either chown it or set RENT_SPLIT_UID/GID — see deploy/CUTOVER.md.
    user: "${RENT_SPLIT_UID:-1000}:${RENT_SPLIT_GID:-1000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s